[project]
name = "npu-harness"
version = "0.1.0"
description = "A local dashboard and model manager for your NPU, built on Foundry Local."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "psutil>=6.1",
    "openvino-genai>=2025.3",
]

[project.scripts]
npu-harness = "npu_harness.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npu_harness"]
